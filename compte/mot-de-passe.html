<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — WealthWaffle</title>
  <meta name="description" content="Réinitialise ton mot de passe WealthWaffle.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/img/waffy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Mot de passe", basePath: "/compte/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/data.js"></script>
<script src="/assets/tools.js"></script>
<script src="/assets/ww-bundle.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="auth-logo">Wealth<em>Waffle</em> 🧇</a>
      <div class="auth-title-sm">Mot de passe oublié</div>
      <div class="auth-subtitle">On t'envoie un lien de réinitialisation</div>
    </div>
    <div class="auth-card">
      <div id="ok-msg" class="auth-success">✅ Lien envoyé — vérifie ta boîte mail !</div>
      <div id="form-reset">
        <div class="auth-field">
          <label class="auth-label">Ton email</label>
          <input type="email" id="email" placeholder="ton@email.be" class="auth-input" id="reset-email">
        </div>
        <button class="auth-btn auth-btn-rose" id="btn-reset">Envoyer le lien →</button>
      </div>
    </div>
    <div class="auth-footer-sm">
      <a href="/compte/connexion.html" class="auth-link-muted-sm">← Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function doReset() {
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  document.getElementById('btn-reset').textContent = 'Envoi…';
  await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.WW_CONFIG.SITE_URL + '/compte/callback.html?type=recovery'
  });
  document.getElementById('form-reset').style.display = 'none';
  document.getElementById('ok-msg').style.display = 'block';
}

window.addEventListener('load', () => {
  document.getElementById('btn-reset').addEventListener('click', doReset);
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') doReset();
  });
});
</script>
</body>
</html>
