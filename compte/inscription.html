<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Last modified: 2026-06-10 10:13:38 -->
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer mon compte — WealthWaffle</title>
  <meta name="description" content="Crée ton compte WealthWaffle — gratuit, accès complet, 7 jours gratuits.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/img/waffy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Inscription", basePath: "/compte/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>

<div class="auth-page">
  <div class="auth-box-wide">
    <div class="auth-header">
      <a href="/" class="auth-logo">Wealth<em>Waffle</em> 🧇</a>
      <div class="auth-title">Bienvenue 👋</div>
    </div>

    <!-- Étape 1 -->
    <div id="step-1" class="auth-card"><form id="form-step1" onsubmit="return false;" autocomplete="on">
      <div class="auth-step-label">Étape 1 / 3 — Tes informations</div>
      <div id="error-msg" class="auth-error hidden"></div>
      <div class="auth-input-cols">
        <div>
          <label class="auth-label">Prénom</label>
          <input type="text" id="prenom" name="given-name" placeholder="Prénom" autocomplete="given-name" class="auth-input auth-input-green">
        </div>
        <div>
          <label class="auth-label">Nom</label>
          <input type="text" id="nom" name="family-name" placeholder="Nom de famille" autocomplete="family-name" class="auth-input auth-input-green">
        </div>
      </div>
      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input type="email" id="email" name="email" placeholder="ton@email.be" autocomplete="email" class="auth-input auth-input-green">
      </div>
      <div class="auth-field-lg">
        <label class="auth-label">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="8 caractères minimum" autocomplete="new-password" class="auth-input auth-input-green">
      </div>
      <button class="auth-btn auth-btn-green" id="btn-step1" type="submit">Continuer →</button>
    </form></div>

    <!-- Étape 2 -->
    <div id="step-2" class="auth-card hidden">
      <div class="auth-step-label">Étape 2 / 3 — Ton niveau</div>
      <div class="auth-quiz-title">Comment tu te situes en finance perso ?</div>
      <div class="auth-level-btns">
        <button class="auth-level-btn" id="lvl-deb" data-level="debutant">🌱 <strong>Débutant</strong> — Je commence à m'intéresser à ma finance perso</button>
        <button class="auth-level-btn" id="lvl-adv" data-level="avance">🚀 <strong>Avancé</strong> — J'investis déjà, je veux aller plus loin</button>
      </div>
      <div class="auth-quiz-title-sm">Ton sujet prioritaire ?</div>
      <div class="auth-topic-grid" id="topic-btns">
        <button class="auth-topic-btn" data-topic="budget">💶 Budget</button>
        <button class="auth-topic-btn" data-topic="invest">📈 Investir</button>
        <button class="auth-topic-btn" data-topic="immo">🏠 Immo</button>
        <button class="auth-topic-btn" data-topic="fiscal">📋 Fiscalité</button>
        <button class="auth-topic-btn" data-topic="crypto">₿ Crypto</button>
        <button class="auth-topic-btn" data-topic="retraite">🏛️ Retraite</button>
      </div>
      <button class="auth-btn auth-btn-rose auth-btn-disabled" id="btn-register" disabled>Créer mon compte →</button>
    </div>

    <!-- Étape 3 -->
    <div id="step-3" class="auth-card-center hidden">
      <div class="auth-confirm-icon">✅</div>
      <div class="auth-confirm-title">Compte créé !</div>
      <div class="auth-confirm-text">Vérifie ton email pour confirmer ton adresse — puis accède à ton dashboard.</div>
      <a href="/dashboard/" class="btn-primary">Accéder à mon dashboard →</a>
    </div>

    <div class="auth-footer">
      Déjà un compte ? <a href="/compte/connexion.html" class="auth-link">Se connecter</a>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/data.js"></script>
<script src="/assets/ww-bundle.js"></script>
<script>
/* Last modified: 2026-06-10 12:01:46 */
// Exécuté après CDN supabase + data.js + ww-bundle.js
const _url  = window.WW_CONFIG?.SUPABASE_URL      || 'https://klhhztxvgudefxmciwfz.supabase.co';
const _key  = window.WW_CONFIG?.SUPABASE_ANON_KEY || '';
if (!_key) console.error('WW: SUPABASE_ANON_KEY manquante — vérifier data.js');
const { createClient } = supabase;
const sb = createClient(_url, _key);
window.WW = { sb };
let selectedLevel = null, selectedTopic = null, userData = {};

function showErr(msg) {
  let err2 = document.getElementById('error-step2');
  if (!err2) {
    err2 = document.createElement('div');
    err2.id = 'error-step2';
    err2.className = 'auth-error';
    const step2 = document.getElementById('step-2');
    if (step2) step2.insertBefore(err2, step2.firstChild);
  }
  err2.textContent = msg;
  err2.classList.remove('hidden');
  // Scroll vers l'erreur
  err2.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function checkReady() {
  const btn = document.getElementById('btn-register');
  const ready = selectedLevel && selectedTopic;
  btn.disabled = !ready;
  btn.classList.toggle('auth-btn-disabled', !ready);
}

function goStep2() {
  const p  = document.getElementById('prenom').value.trim();
  const e  = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  if (!p || !e || !pw) {
    err.textContent = 'Remplis tous les champs.';
    err.classList.remove('hidden'); return;
  }
  if (pw.length < 8) {
    err.textContent = 'Mot de passe trop court (8 caractères minimum).';
    err.classList.remove('hidden'); return;
  }
  if (!e.includes('@')) {
    err.textContent = 'Adresse email invalide.';
    err.classList.remove('hidden'); return;
  }
  userData = { prenom: p, nom: document.getElementById('nom')?.value.trim() || '', email: e, password: pw };
  document.getElementById('step-1').classList.add('hidden');
  document.getElementById('step-2').classList.remove('hidden');
}

async function doRegister() {
  const btn = document.getElementById('btn-register');
  btn.textContent = 'Création en cours…'; btn.disabled = true;

  // Vérifier que userData est bien rempli
  if (!userData.email || !userData.password) {
    btn.textContent = 'Créer mon compte →'; btn.disabled = false;
    showErr('Données manquantes — recommence depuis l\'étape 1.');
    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('step-1').classList.remove('hidden');
    return;
  }

  let data, error;
  try {
    const res = await sb.auth.signUp({
      email: userData.email,
      password: userData.password,
      options: {
        data: {
          prenom: userData.prenom,
          nom: userData.nom || '',
          level: selectedLevel,
          topic: selectedTopic,
        },
        emailRedirectTo: (window.WW_CONFIG?.SITE_URL || 'https://wealthwaffle.be') + '/compte/callback.html?type=signup',
      }
    });
    data  = res.data;
    error = res.error;
  } catch(e) {
    btn.textContent = 'Créer mon compte →'; btn.disabled = false;
    showErr('Erreur de connexion — vérifie ta connexion internet.');
    return;
  }

  if (error) {
    btn.textContent = 'Créer mon compte →'; btn.disabled = false;
    const msg = error.message || '';
    if (msg.includes('already registered') || msg.includes('already exists') || msg.includes('User already registered')) {
      showErr('Cet email est déjà utilisé — connecte-toi plutôt.');
    } else if (msg.includes('password')) {
      showErr('Mot de passe trop faible (8 caractères minimum).');
    } else if (msg.includes('invalid') && msg.includes('email')) {
      showErr('Adresse email invalide.');
    } else if (msg.includes('Email rate limit')) {
      showErr('Trop de tentatives — attends quelques minutes.');
    } else {
      showErr('Erreur : ' + msg);
    }
    return;
  }

  // Succès
  localStorage.setItem('ww_level', selectedLevel);
  localStorage.setItem('ww_topic', selectedTopic);
  document.getElementById('step-2').classList.add('hidden');
  document.getElementById('step-3').classList.remove('hidden');

  // Si email confirmation désactivé → session directe → rediriger
  if (data?.session) {
    localStorage.setItem('ww_session', data.session.access_token);
    localStorage.setItem('ww_plan', 'socle');
    setTimeout(function() { window.location.href = '/dashboard/'; }, 1500);
  }
}

window.addEventListener('load', function() {
  document.getElementById('btn-step1').addEventListener('click', goStep2);
  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') goStep2();
  });
  document.getElementById('btn-register').addEventListener('click', doRegister);

  // Boutons niveau — SANS style= inline
  document.querySelectorAll('.auth-level-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      selectedLevel = btn.dataset.level;
      document.querySelectorAll('.auth-level-btn').forEach(function(b) {
        b.classList.remove('auth-level-btn-active-deb', 'auth-level-btn-active-adv');
      });
      btn.classList.add(
        selectedLevel === 'debutant' ? 'auth-level-btn-active-deb' : 'auth-level-btn-active-adv'
      );
      checkReady();
    });
  });

  // Boutons topic — SANS style= inline
  document.querySelectorAll('.auth-topic-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      selectedTopic = btn.dataset.topic;
      document.querySelectorAll('.auth-topic-btn').forEach(function(b) {
        b.classList.remove('auth-topic-btn-active');
      });
      btn.classList.add('auth-topic-btn-active');
      checkReady();
    });
  });
});
</script>
</body>
</html>
