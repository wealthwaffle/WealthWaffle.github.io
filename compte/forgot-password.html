<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mot de passe oublié — Doctrine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/doctrine-app.css">
  
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-text">Doctrine</div>
      <div class="auth-logo-sub">par WealthWaffle 🧇</div>
    </div>

    <div style="font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:6px;">Mot de passe oublié ?</div>
    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:22px;line-height:1.55;">Saisis ton email — on t'envoie un lien de réinitialisation valable 1 heure.</div>

    <div class="alert alert-error" id="error-msg" style="display:none;">
      <span>⚠️</span><span id="error-text">Une erreur est survenue.</span>
    </div>

    <div class="alert alert-success" id="success-msg" style="display:none;">
      <span>✓</span>
      <span>Lien envoyé ! Vérifie ta boîte mail et clique sur le lien pour réinitialiser ton mot de passe.</span>
    </div>

    <div id="form-wrap">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email"
          placeholder="ton@email.be" autocomplete="email" inputmode="email"
          onkeydown="if(event.key==='Enter') doReset()">
      </div>

      <button class="btn btn-primary btn-full" id="reset-btn" onclick="doReset()">
        Envoyer le lien →
      </button>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:0.80rem;color:var(--muted);">
      <a href="/pages/auth/login.html" style="color:var(--cyan);">← Retour à la connexion</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function doReset() {
      const email  = document.getElementById('email').value.trim();
      const btn    = document.getElementById('reset-btn');
      const errBox = document.getElementById('error-msg');
      const errTxt = document.getElementById('error-text');

      if (!email) { document.getElementById('email').focus(); return; }

      btn.textContent = 'Envoi...';
      btn.disabled    = true;
      errBox.style.display = 'none';

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.DOCTRINE_CONFIG.APP_URL}/pages/auth/callback.html?type=recovery`,
      });

      if (error) {
        btn.textContent = 'Envoyer le lien →';
        btn.disabled    = false;
        errTxt.textContent = error.message;
        errBox.style.display = 'flex';
        return;
      }

      document.getElementById('form-wrap').style.display = 'none';
      document.getElementById('success-msg').style.display = 'flex';
    }
  </script>
</body>
</html>
