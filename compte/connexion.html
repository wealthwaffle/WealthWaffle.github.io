<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — WealthWaffle</title>
  <meta name="description" content="Connecte-toi à ton compte WealthWaffle.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/img/waffy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Connexion", basePath: "/compte/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/data.js"></script>
<script src="/assets/tools.js"></script>
<script src="/assets/ww-bundle.js" defer></script>
<script>
window.WW_CONFIG = {
  SUPABASE_URL:      window.__CF_SUPABASE_URL__      || 'https://TON_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: window.__CF_SUPABASE_ANON_KEY__ || 'TON_ANON_KEY',
  STRIPE_KEY:        window.__CF_STRIPE_KEY__         || 'pk_live_TON_KEY',
  PRICES: {
    socle_monthly:  window.__CF_PRICE_SOCLE_M__  || 'price_SOCLE_MENSUEL',
    socle_annual:   window.__CF_PRICE_SOCLE_A__  || 'price_SOCLE_ANNUEL',
    pilote_monthly: window.__CF_PRICE_PILOTE_M__ || 'price_PILOTE_MENSUEL',
    pilote_annual:  window.__CF_PRICE_PILOTE_A__ || 'price_PILOTE_ANNUEL',
    radar_monthly:  window.__CF_PRICE_RADAR_M__  || 'price_RADAR_MENSUEL',
    radar_annual:   window.__CF_PRICE_RADAR_A__  || 'price_RADAR_ANNUEL',
  },
  SITE_URL: 'https://wealthwaffle.be',
  TRIAL_DAYS: 7,
  BREVO_KEY: window.__CF_BREVO_KEY__ || '',
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="auth-logo">Wealth<em>Waffle</em> 🧇</a>
      <div class="auth-title">Content de te revoir</div>
      <div class="auth-subtitle">Connecte-toi à ton espace personnel</div>
    </div>
    <div class="auth-card">
      <div id="error-msg" class="auth-error"></div>
      <div class="auth-field">
        <label class="auth-label-lg">Email</label>
        <input type="email" id="email" placeholder="ton@email.be" autocomplete="email" class="auth-input">
      </div>
      <div class="auth-field-lg">
        <label class="auth-label-lg">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" class="auth-input" id="pw-input">
      </div>
      <button class="auth-btn auth-btn-rose" id="btn-login">Se connecter →</button>
      <div class="auth-forgot-link">
        <a href="/compte/mot-de-passe.html" class="auth-link-muted">Mot de passe oublié ?</a>
      </div>
    </div>
    <div class="auth-footer">
      Pas encore de compte ? <a href="/compte/inscription.html" class="auth-link">Créer mon compte gratuit</a>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function getSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  window.WW.user    = session.user;
  window.WW.profile = profile;
  localStorage.setItem('ww_session', session.access_token);
  localStorage.setItem('ww_plan', profile?.plan || 'socle');
  return { user: session.user, profile };
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const btn   = document.getElementById('btn-login');
  const err   = document.getElementById('error-msg');
  if (!email || !pass) { err.textContent = 'Remplis les deux champs.'; err.style.display='block'; return; }
  btn.textContent = 'Connexion…'; btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = error.message === 'Invalid login credentials'
      ? 'Email ou mot de passe incorrect.' : error.message;
    err.style.display = 'block';
    btn.textContent = 'Se connecter →'; btn.disabled = false;
  } else {
    const next = new URLSearchParams(location.search).get('next') || '/dashboard/';
    window.location.href = next;
  }
}

window.addEventListener('load', async () => {
  const session = await getSession();
  if (session) { window.location.href = '/dashboard/'; return; }
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
</script>
</body>
</html>
