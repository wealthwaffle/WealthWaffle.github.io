<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — WealthWaffle</title>
  <meta name="description" content="Connecte-toi à ton compte WealthWaffle.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/IMG_5202.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Connexion", basePath: "/compte/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/ww-bundle.js" defer></script>
<script>
/* ── WealthWaffle Config — à remplir dans Cloudflare Pages env vars ── */
window.WW_CONFIG = {
  SUPABASE_URL:      window.__CF_SUPABASE_URL__      || 'https://TON_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: window.__CF_SUPABASE_ANON_KEY__ || 'TON_ANON_KEY',
  STRIPE_KEY:        window.__CF_STRIPE_KEY__         || 'pk_live_TON_KEY',
  PRICES: {
    socle_monthly:  window.__CF_PRICE_SOCLE_M__  || 'price_SOCLE_MENSUEL',
    socle_annual:   window.__CF_PRICE_SOCLE_A__  || 'price_SOCLE_ANNUEL',
    pilote_monthly: window.__CF_PRICE_PILOTE_M__ || 'price_PILOTE_MENSUEL',
    pilote_annual:  window.__CF_PRICE_PILOTE_A__ || 'price_PILOTE_ANNUEL',
    radar_monthly:  window.__CF_PRICE_RADAR_M__  || 'price_RADAR_MENSUEL',
    radar_annual:   window.__CF_PRICE_RADAR_A__  || 'price_RADAR_ANNUEL',
  },
  SITE_URL: 'https://wealthwaffle.be',
  TRIAL_DAYS: 7,
  BREVO_KEY: window.__CF_BREVO_KEY__ || '',
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div class="page" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:380px;">
    <div style="text-align:center;margin-bottom:28px;">
      <a href="/" style="font-size:1.4rem;text-decoration:none;">Wealth<em style="font-style:italic;">Waffle</em> 🧇</a>
      <div style="font-family:'DM Serif Display',serif;font-style:italic;font-size:1.5rem;color:var(--text);margin-top:12px;">Content de te revoir</div>
      <div style="font-size:0.80rem;color:var(--muted);margin-top:4px;">Connecte-toi à ton espace personnel</div>
    </div>
    <div style="background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:28px 24px;">
      <div id="error-msg" style="display:none;background:rgba(232,124,195,0.08);border:1px solid rgba(232,124,195,0.25);border-radius:10px;padding:10px 14px;font-size:0.80rem;color:var(--rose);margin-bottom:14px;"></div>
      <div style="margin-bottom:14px;">
        <label style="font-size:0.72rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;">Email</label>
        <input type="email" id="email" placeholder="ton@email.be" autocomplete="email"
          style="width:100%;background:var(--s3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--text);outline:none;box-sizing:border-box;"
          onfocus="this.style.borderColor='rgba(232,124,195,0.45)'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-size:0.72rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
          style="width:100%;background:var(--s3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--text);outline:none;box-sizing:border-box;"
          onfocus="this.style.borderColor='rgba(232,124,195,0.45)'" onblur="this.style.borderColor='var(--border)'"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button onclick="doLogin()" id="btn-login"
        style="width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#E87CC3,#5BB8D4);color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;transition:opacity 0.18s;">
        Se connecter →
      </button>
      <div style="text-align:center;margin-top:14px;">
        <a href="/compte/mot-de-passe.html" style="font-size:0.76rem;color:var(--muted);text-decoration:none;">Mot de passe oublié ?</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:18px;font-size:0.80rem;color:var(--muted);">
      Pas encore de compte ? <a href="/compte/inscription.html" style="color:var(--rose);font-weight:600;">Créer mon compte gratuit</a>
    </div>
  </div>
</div>
<script>
/* ── Auth helpers — WealthWaffle ─────────────────────────── */
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function getSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  window.WW.user    = session.user;
  window.WW.profile = profile;
  // Sync level to localStorage pour les outils et blurs
  localStorage.setItem('ww_session', session.access_token);
  localStorage.setItem('ww_plan', profile?.plan || 'socle');
  return { user: session.user, profile };
}

async function requireAuth(minLevel) {
  const LEVELS = { socle: 1, pilote: 2, radar: 3 };
  const session = await getSession();
  if (!session) { window.location.href = '/compte/connexion.html?next=' + encodeURIComponent(location.pathname); return null; }
  const userLevel  = LEVELS[session.profile?.plan] || 0;
  const neededLevel = LEVELS[minLevel] || 1;
  if (userLevel < neededLevel) { window.location.href = '/compte/inscription.html?plan=' + minLevel; return null; }
  return session;
}

async function signOut() {
  await sb.auth.signOut();
  localStorage.removeItem('ww_session');
  localStorage.removeItem('ww_plan');
  window.location.href = '/';
}
</script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Si déjà connecté → dashboard
  const session = await getSession();
  if (session) { window.location.href = '/dashboard/'; return; }
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const btn   = document.getElementById('btn-login');
  const err   = document.getElementById('error-msg');
  if (!email || !pass) { err.textContent = 'Remplis les deux champs.'; err.style.display='block'; return; }
  btn.textContent = 'Connexion…'; btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = error.message === 'Invalid login credentials'
      ? 'Email ou mot de passe incorrect.' : error.message;
    err.style.display = 'block';
    btn.textContent = 'Se connecter →'; btn.disabled = false;
  } else {
    const next = new URLSearchParams(location.search).get('next') || '/dashboard/';
    window.location.href = next;
  }
}
</script>
</body></html>
