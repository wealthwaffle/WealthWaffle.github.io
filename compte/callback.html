<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chargement… — WealthWaffle</title>
  <meta name="description" content="Traitement de ta connexion.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/IMG_5202.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Callback", basePath: "/compte/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/ww-bundle.js" defer></script>
<script>
/* ── WealthWaffle Config — à remplir dans Cloudflare Pages env vars ── */
window.WW_CONFIG = {
  SUPABASE_URL:      window.__CF_SUPABASE_URL__      || 'https://TON_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: window.__CF_SUPABASE_ANON_KEY__ || 'TON_ANON_KEY',
  STRIPE_KEY:        window.__CF_STRIPE_KEY__         || 'pk_live_TON_KEY',
  PRICES: {
    socle_monthly:  window.__CF_PRICE_SOCLE_M__  || 'price_SOCLE_MENSUEL',
    socle_annual:   window.__CF_PRICE_SOCLE_A__  || 'price_SOCLE_ANNUEL',
    pilote_monthly: window.__CF_PRICE_PILOTE_M__ || 'price_PILOTE_MENSUEL',
    pilote_annual:  window.__CF_PRICE_PILOTE_A__ || 'price_PILOTE_ANNUEL',
    radar_monthly:  window.__CF_PRICE_RADAR_M__  || 'price_RADAR_MENSUEL',
    radar_annual:   window.__CF_PRICE_RADAR_A__  || 'price_RADAR_ANNUEL',
  },
  SITE_URL: 'https://wealthwaffle.be',
  TRIAL_DAYS: 7,
  BREVO_KEY: window.__CF_BREVO_KEY__ || '',
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
  <div style="font-size:2rem;animation:spin 1s linear infinite;">⟳</div>
  <div style="font-size:0.84rem;color:var(--muted);" id="status-msg">Connexion en cours…</div>
</div>
<style>@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }</style>
<script>
/* ── Auth helpers — WealthWaffle ─────────────────────────── */
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function getSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  window.WW.user    = session.user;
  window.WW.profile = profile;
  // Sync level to localStorage pour les outils et blurs
  localStorage.setItem('ww_session', session.access_token);
  localStorage.setItem('ww_plan', profile?.plan || 'socle');
  return { user: session.user, profile };
}

async function requireAuth(minLevel) {
  const LEVELS = { socle: 1, pilote: 2, radar: 3 };
  const session = await getSession();
  if (!session) { window.location.href = '/compte/connexion.html?next=' + encodeURIComponent(location.pathname); return null; }
  const userLevel  = LEVELS[session.profile?.plan] || 0;
  const neededLevel = LEVELS[minLevel] || 1;
  if (userLevel < neededLevel) { window.location.href = '/compte/inscription.html?plan=' + minLevel; return null; }
  return session;
}

async function signOut() {
  await sb.auth.signOut();
  localStorage.removeItem('ww_session');
  localStorage.removeItem('ww_plan');
  window.location.href = '/';
}
</script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.hash.replace('#','?') + '&' + window.location.search.replace('?',''));
  const type = params.get('type') || new URLSearchParams(location.search).get('type');
  const msg = document.getElementById('status-msg');

  // Attendre que Supabase traite le token dans le hash
  const { data, error } = await sb.auth.getSession();

  if (error) { msg.textContent = 'Erreur de connexion — ' + error.message; return; }

  if (type === 'recovery') {
    msg.textContent = 'Redirigé vers la réinitialisation…';
    setTimeout(() => window.location.href = '/compte/connexion.html', 1500);
  } else if (type === 'signup') {
    msg.textContent = 'Email confirmé ✅ Redirection…';
    setTimeout(() => window.location.href = '/dashboard/', 1500);
  } else {
    const session = await getSession();
    msg.textContent = session ? 'Connecté ✅' : 'Session non trouvée.';
    setTimeout(() => window.location.href = session ? '/dashboard/' : '/compte/connexion.html', 1200);
  }
});
</script>
</body></html>
