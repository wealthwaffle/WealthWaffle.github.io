<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connexion en cours — Doctrine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/doctrine-app.css">
  
</head>
<body>

  <div class="callback-card" id="loading-view">
    <div class="spinner"></div>
    <div class="callback-title">Vérification en cours…</div>
    <div class="callback-sub" id="status-text">On vérifie ton lien, ça prend quelques secondes.</div>

    <!-- Formulaire nouveau mot de passe (affiché si mode=recovery) -->
    <div class="pw-form" id="pw-form">
      <div class="field">
        <label class="field-label" for="new-pw">Nouveau mot de passe</label>
        <input class="field-input" type="password" id="new-pw"
          placeholder="8 caractères minimum" autocomplete="new-password"
          onkeydown="if(event.key==='Enter') doUpdatePassword()">
      </div>
      <button class="btn btn-primary btn-full" onclick="doUpdatePassword()">
        Enregistrer le nouveau mot de passe →
      </button>
    </div>

    <div class="alert alert-error" id="error-box" style="display:none;margin-top:16px;">
      <span>⚠️</span><span id="error-text">Lien invalide ou expiré.</span>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {

      // Supabase gère les tokens via le hash de l'URL (#access_token=...&type=...)
      // ou via les query params (?code=...)
      // On laisse Supabase parser automatiquement
      const { data: { session }, error } = await sb.auth.getSession();

      // Lire le type dans le hash ou les params
      const hash   = window.location.hash;
      const params = new URLSearchParams(window.location.search);
      const type   = params.get('type') ||
        (hash.includes('type=recovery') ? 'recovery' : 'signup');

      if (error) {
        showError('Lien invalide ou expiré. Demande un nouveau lien.');
        return;
      }

      if (type === 'recovery') {
        // Mode réinitialisation mot de passe
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('status-text').textContent =
          'Saisis ton nouveau mot de passe.';
        document.getElementById('pw-form').style.display = 'block';
        return;
      }

      // Mode confirmation email (signup)
      if (session) {
        document.getElementById('status-text').textContent =
          'Email confirmé ! Redirection vers ton espace Socle…';
        setTimeout(() => {
          window.location.href = '/pages/socle/index.html';
        }, 1500);
      } else {
        // Pas encore de session — attendre l'échange de token
        const { data: authData, error: authError } =
          await sb.auth.exchangeCodeForSession(window.location.href);

        if (authError || !authData.session) {
          showError('Lien invalide ou expiré. Retente de te connecter.');
          return;
        }

        document.getElementById('status-text').textContent =
          'Email confirmé ! Redirection…';
        setTimeout(() => {
          window.location.href = '/pages/socle/index.html';
        }, 1200);
      }
    });

    async function doUpdatePassword() {
      const pw  = document.getElementById('new-pw').value;
      const btn = document.querySelector('#pw-form button');

      if (!pw || pw.length < 8) {
        document.getElementById('new-pw').focus();
        return;
      }

      btn.textContent = 'Enregistrement...';
      btn.disabled    = true;

      const { error } = await sb.auth.updateUser({ password: pw });

      if (error) {
        btn.textContent = 'Enregistrer le nouveau mot de passe →';
        btn.disabled    = false;
        showError(error.message);
        return;
      }

      document.getElementById('pw-form').style.display = 'none';
      document.querySelector('.spinner').style.display = 'block';
      document.getElementById('status-text').textContent =
        'Mot de passe mis à jour ! Redirection…';

      setTimeout(() => {
        window.location.href = '/pages/socle/index.html';
      }, 1500);
    }

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('status-text').textContent = '';
      document.getElementById('error-text').textContent  = msg;
      document.getElementById('error-box').style.display = 'flex';
    }
  </script>
</body>
</html>
