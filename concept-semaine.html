function getWeek() {
  var now = new Date(), start = new Date(now.getFullYear(),0,1);
  return Math.min(Math.ceil((now-start)/(1000*60*60*24*7)),52);
}

  var week = getWeek();
  var c = CONCEPTS.find(function(x){ return x.semaine===week; }) || CONCEPTS[0];
  var el = document.getElementById("current-concept");
  if (el) el.innerHTML = '<div class="concept-week-badge">Semaine '+week+' / 52</div><div class="concept-categorie">'+c.categorie+'</div><h2 class="concept-titre">'+c.titre+'</h2><a href="'+c.url+'" class="btn-primary">D&#233;couvrir ce concept &#8594;</a>';

  var past = CONCEPTS.filter(function(x){ return x.semaine < week; }).reverse();
  var container = document.getElementById("concept-history");
  if (container) {
    if (!past.length) { container.innerHTML = '<p style="color:var(--muted);font-size:0.84rem;grid-column:1/-1;padding:20px 0;text-align:center;">Aucun concept pr&#233;c&#233;dent.</p>'; }
