<!-- WealthWaffle — UI Components (loaded dynamically via components.js) -->

<!-- ── Cookie Banner ── -->
<div class="cookie-banner" id="cookie-banner">
  <div class="cookie-top">
    <span class="cookie-emoji">🍪</span>
    <div class="cookie-text">
      <h4>Cookies analytiques</h4>
      <p>Données anonymisées uniquement. <button onclick="openModal('privacy')" style="background:none;border:none;color:var(--cyan);cursor:pointer;font-size:inherit;padding:0;">En savoir plus</button></p>
    </div>
  </div>
  <div class="cookie-actions">
    <button class="btn-cookie-ok" onclick="acceptCookies()">Accepter</button>
    <button class="btn-cookie-no" onclick="refuseCookies()">Refuser</button>
  </div>
</div>

<!-- ── Modal overlay ── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>
