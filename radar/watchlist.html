<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👁️ Ma watchlist Radar — WealthWaffle</title>
  <meta name="description" content="Tes projets equity et crowdlending suivis sur le Radar WealthWaffle.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/img/waffy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Watchlist", basePath: "/radar/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/data.js"></script>
<script src="/assets/tools.js"></script>
<script src="/assets/ww-bundle.js" defer></script>
<script>
window.WW_CONFIG = {
  SUPABASE_URL:      window.__CF_SUPABASE_URL__      || 'https://TON_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: window.__CF_SUPABASE_ANON_KEY__ || 'TON_ANON_KEY',
  STRIPE_KEY:        window.__CF_STRIPE_KEY__         || 'pk_live_TON_KEY',
  PRICES: {
    socle_monthly:  window.__CF_PRICE_SOCLE_M__  || 'price_SOCLE_MENSUEL',
    socle_annual:   window.__CF_PRICE_SOCLE_A__  || 'price_SOCLE_ANNUEL',
    pilote_monthly: window.__CF_PRICE_PILOTE_M__ || 'price_PILOTE_MENSUEL',
    pilote_annual:  window.__CF_PRICE_PILOTE_A__ || 'price_PILOTE_ANNUEL',
    radar_monthly:  window.__CF_PRICE_RADAR_M__  || 'price_RADAR_MENSUEL',
    radar_annual:   window.__CF_PRICE_RADAR_A__  || 'price_RADAR_ANNUEL',
  },
  SITE_URL: 'https://wealthwaffle.be',
  TRIAL_DAYS: 7,
  BREVO_KEY: window.__CF_BREVO_KEY__ || '',
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="page">
<div class="breadcrumb"><a href="/">Accueil</a><span>/</span><a href="/radar/">Radar</a><span>/</span><span>Ma watchlist</span></div>

<div class="eyebrow eyebrow-invest">👁️ Watchlist</div>
<h1 class="display">Mes projets suivis</h1>
<p class="radar-desc">Tous les projets que tu suis sur le Radar. Mis à jour en temps réel.</p>

<div id="watchlist-container">
  <div class="watchlist-loading">Chargement…</div>
</div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function getSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  window.WW.user = session.user; window.WW.profile = profile;
  localStorage.setItem('ww_session', session.access_token);
  localStorage.setItem('ww_plan', profile?.plan || 'socle');
  return { user: session.user, profile };
}

async function requireAuth(minLevel) {
  const LEVELS = { socle:1, pilote:2, radar:3 };
  const session = await getSession();
  if (!session) { window.location.href = '/compte/connexion.html?next=' + encodeURIComponent(location.pathname); return null; }
  if ((LEVELS[session.profile?.plan]||0) < (LEVELS[minLevel]||1)) { window.location.href = '/compte/inscription.html?plan=' + minLevel; return null; }
  return session;
}

window.addEventListener('load', async () => {
  const session = await requireAuth('radar');
  if (!session) return;
  const userId = session.user.id;
  const container = document.getElementById('watchlist-container');

  const { data: wl } = await sb.from('watchlist').select('project_id').eq('user_id', userId);
  const ids = (wl||[]).map(w => w.project_id);

  if (!ids.length) {
    container.innerHTML = `
      <div class="watchlist-empty">
        <div class="watchlist-empty-icon">👁️</div>
        <div class="dash-chapters-msg">Ta watchlist est vide — <a href="/radar/" class="link-invest">parcourir le feed →</a></div>
      </div>`;
    return;
  }

  const { data: projects } = await sb.from('projects').select('*').in('id', ids);
  const list = projects || [];
  container.innerHTML = '';

  if (!list.length) {
    container.innerHTML = '<div class="watchlist-loading">Projets introuvables.</div>';
    return;
  }

  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'watchlist-card';

    const header = document.createElement('div');
    header.className = 'watchlist-card-header';

    const info = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'watchlist-card-title';
    title.textContent = p.name;
    const meta = document.createElement('div');
    meta.className = 'watchlist-card-meta';
    meta.textContent = `${p.platform} · ${p.type}${p.rate ? ` · ${p.rate}%` : ''}`;
    info.appendChild(title); info.appendChild(meta);
    header.appendChild(info);

    if (p.url) {
      const link = document.createElement('a');
      link.href = p.url; link.target = '_blank'; link.rel = 'noopener';
      link.className = 'link-invest'; link.style.fontSize = '0.74rem';
      link.textContent = 'Voir ↗';
      header.appendChild(link);
    }

    const desc = document.createElement('div');
    desc.className = 'watchlist-card-desc';
    desc.textContent = p.summary;

    card.appendChild(header);
    card.appendChild(desc);
    container.appendChild(card);
  });
});
</script>
</body>
</html>
