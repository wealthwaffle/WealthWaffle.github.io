<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 Radar Equity — WealthWaffle</title>
  <meta name="description" content="Feed projets equity et crowdlending belges. Analyse scoring, verdict, watchlist. Accès Radar uniquement.">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#E87CC3">
  <link rel="apple-touch-icon" href="/img/waffy-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
  <script>window.WW_PAGE_META = { name: "Radar", basePath: "/radar/", auth: true };</script>
</head>
<body>
<div id="ww-ui-placeholder"></div>
<div class="bg-mesh"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
<script src="/assets/data.js"></script>
<script src="/assets/tools.js"></script>
<script src="/assets/ww-bundle.js" defer></script>
<script>
window.WW_CONFIG = {
  SUPABASE_URL:      window.__CF_SUPABASE_URL__      || 'https://TON_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: window.__CF_SUPABASE_ANON_KEY__ || 'TON_ANON_KEY',
  STRIPE_KEY:        window.__CF_STRIPE_KEY__         || 'pk_live_TON_KEY',
  PRICES: {
    socle_monthly:  window.__CF_PRICE_SOCLE_M__  || 'price_SOCLE_MENSUEL',
    socle_annual:   window.__CF_PRICE_SOCLE_A__  || 'price_SOCLE_ANNUEL',
    pilote_monthly: window.__CF_PRICE_PILOTE_M__ || 'price_PILOTE_MENSUEL',
    pilote_annual:  window.__CF_PRICE_PILOTE_A__ || 'price_PILOTE_ANNUEL',
    radar_monthly:  window.__CF_PRICE_RADAR_M__  || 'price_RADAR_MENSUEL',
    radar_annual:   window.__CF_PRICE_RADAR_A__  || 'price_RADAR_ANNUEL',
  },
  SITE_URL: 'https://wealthwaffle.be',
  TRIAL_DAYS: 7,
  BREVO_KEY: window.__CF_BREVO_KEY__ || '',
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="page">
<div class="breadcrumb"><a href="/">Accueil</a><span>/</span><span>Radar Equity</span></div>

<div class="radar-header">
  <div>
    <div class="eyebrow eyebrow-invest">📡 Radar</div>
    <h1 class="display">Projets equity &amp; crowdlending</h1>
  </div>
  <a href="/radar/watchlist.html" class="radar-watchlist-btn">👁️ Ma watchlist</a>
</div>
<p class="radar-desc">Projets analysés par WealthWaffle — scoring conviction, verdict, accès direct aux plateformes. Mis à jour en continu.</p>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">Tous</button>
  <button class="filter-btn" data-filter="interessant">✅ Intéressant</button>
  <button class="filter-btn" data-filter="surveiller">👀 À surveiller</button>
  <button class="filter-btn" data-filter="crowdlending">🤝 Crowdlending</button>
  <button class="filter-btn" data-filter="equity">🚀 Equity</button>
  <button class="filter-btn" data-filter="immo">🏠 Immo</button>
</div>

<div id="feed-container">
  <div class="watchlist-loading">Chargement des projets…</div>
</div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(window.WW_CONFIG.SUPABASE_URL, window.WW_CONFIG.SUPABASE_ANON_KEY);
window.WW = { sb };

async function getSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  window.WW.user = session.user; window.WW.profile = profile;
  localStorage.setItem('ww_session', session.access_token);
  localStorage.setItem('ww_plan', profile?.plan || 'socle');
  return { user: session.user, profile };
}

async function requireAuth(minLevel) {
  const LEVELS = { socle:1, pilote:2, radar:3 };
  const session = await getSession();
  if (!session) { window.location.href = '/compte/connexion.html?next=' + encodeURIComponent(location.pathname); return null; }
  if ((LEVELS[session.profile?.plan]||0) < (LEVELS[minLevel]||1)) { window.location.href = '/compte/inscription.html?plan=' + minLevel; return null; }
  return session;
}

let allProjects = [], watchedIds = new Set(), userId = null;

function scoreColor(s) { return s >= 7 ? '#7EC8A0' : s >= 5 ? '#E8C23A' : '#E87CC3'; }

function renderProjects(list) {
  const container = document.getElementById('feed-container');
  if (!list.length) {
    container.innerHTML = '<div class="watchlist-loading">Aucun projet pour ce filtre.</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(p => {
    const verdictLabels = { interessant:'✅ Intéressant', surveiller:'👀 À surveiller', insuffisant:'Insuffisant', trop_risque:'⚠️ Trop risqué' };
    const isWatched = watchedIds.has(p.id);
    const card = document.createElement('div');
    card.className = 'project-card';
    card.dataset.type = p.type;
    card.dataset.verdict = p.verdict;

    const header = document.createElement('div');
    header.className = 'project-header';
    header.innerHTML = `
      <div>
        <div class="project-title">${p.name}</div>
        <div class="project-meta">
          <span class="project-platform">${p.platform}</span>
          <span>${p.type}</span>
          ${p.min_invest ? `<span>Min. ${p.min_invest}€</span>` : ''}
          ${p.rate ? `<span class="txt-budget">${p.rate}%</span>` : ''}
        </div>
      </div>
      <span class="verdict-badge verdict-${p.verdict}">${verdictLabels[p.verdict]||p.verdict}</span>`;

    const summary = document.createElement('div');
    summary.className = 'project-summary';
    summary.textContent = p.summary;

    const actions = document.createElement('div');
    actions.className = 'project-actions';

    if (p.url) {
      const link = document.createElement('a');
      link.href = p.url; link.target = '_blank'; link.rel = 'noopener';
      link.className = 'link-invest'; link.style.fontSize = '0.74rem';
      link.textContent = 'Voir le projet ↗';
      actions.appendChild(link);
    }
    const watchBtn = document.createElement('button');
    watchBtn.className = 'follow-btn' + (isWatched ? ' watched' : '');
    watchBtn.textContent = isWatched ? '👁️ Suivi' : '+ Suivre';
    watchBtn.dataset.id = p.id;
    actions.appendChild(watchBtn);

    card.appendChild(header);
    card.appendChild(summary);

    if (p.score_risque !== undefined) {
      const scores = [
        { label:'Risque',    val:p.score_risque,     color:scoreColor(10-p.score_risque) },
        { label:'Conviction',val:p.score_conviction, color:scoreColor(p.score_conviction) },
        { label:'Liquidité', val:p.score_liquidite,  color:scoreColor(p.score_liquidite) },
      ];
      const scoreRow = document.createElement('div');
      scoreRow.className = 'score-row';
      scores.forEach(s => {
        scoreRow.innerHTML += `<div><div class="score-label">${s.label}</div><div class="score-bar"><div class="score-fill" style="width:${s.val*10}%;background:${s.color};"></div></div></div>`;
      });
      card.appendChild(scoreRow);
    }

    card.appendChild(actions);
    container.appendChild(card);
  });
}

function filterProjects(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  const filtered = filter === 'all' ? allProjects
    : allProjects.filter(p => p.type === filter || p.verdict === filter);
  renderProjects(filtered);
}

async function toggleWatch(projectId, btn) {
  if (!userId) return;
  if (watchedIds.has(projectId)) {
    watchedIds.delete(projectId);
    btn.textContent = '+ Suivre'; btn.classList.remove('watched');
    await sb.from('watchlist').delete().eq('user_id', userId).eq('project_id', projectId);
  } else {
    watchedIds.add(projectId);
    btn.textContent = '👁️ Suivi'; btn.classList.add('watched');
    await sb.from('watchlist').insert({ user_id: userId, project_id: projectId });
  }
}

window.addEventListener('load', async () => {
  // Filtres
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => filterProjects(btn.dataset.filter));
  });
  // Délégation watchlist
  document.getElementById('feed-container').addEventListener('click', e => {
    const btn = e.target.closest('.follow-btn');
    if (btn) toggleWatch(btn.dataset.id, btn);
  });

  const session = await requireAuth('radar');
  if (!session) return;
  userId = session.user.id;

  const { data: wl } = await sb.from('watchlist').select('project_id').eq('user_id', userId);
  watchedIds = new Set((wl||[]).map(w => w.project_id));

  const { data: projects } = await sb.from('projects').select('*').order('created_at', { ascending: false });
  allProjects = projects || [];
  renderProjects(allProjects);
});
</script>
</body>
</html>
