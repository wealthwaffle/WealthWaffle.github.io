<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bienvenue dans Doctrine !</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/doctrine-app.css">
  
</head>
<body>

  <div class="success-card">
    <div class="confetti">🎉</div>

    <div style="font-family:'DM Serif Display',serif;font-style:italic;font-size:1.6rem;margin-bottom:8px;background:linear-gradient(90deg,#E87CC3,#5BB8D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
      Bienvenue !
    </div>

    <div style="font-size:0.84rem;color:var(--muted);line-height:1.7;margin-bottom:6px;" id="success-level">
      Ton abonnement est activé.
    </div>

    <div style="font-size:0.78rem;color:var(--muted2);margin-bottom:28px;" id="success-sub">
      Un email de confirmation arrive dans ta boîte mail.
    </div>

    <!-- Spinner pendant vérification -->
    <div id="loading-indicator" style="margin-bottom:20px;">
      <div style="width:28px;height:28px;border-radius:50%;border:3px solid rgba(126,200,160,0.2);border-top-color:#7EC8A0;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
      <div style="font-size:0.74rem;color:var(--muted);margin-top:8px;">Activation du compte en cours…</div>
    </div>

    <div id="cta-section" style="display:none;flex-direction:column;gap:10px;align-items:center;">
      <a href="/pages/pilote/index.html" id="cta-primary" class="btn btn-pilote btn-full">
        Accéder à mon espace →
      </a>
      <a href="/pages/account/index.html" style="font-size:0.76rem;color:var(--muted);">
        Voir mon compte
      </a>
    </div>

    
  </div>

  <script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Attendre que le webhook Stripe ait mis à jour Supabase (max 8 secondes)
      let attempts = 0;
      const maxAttempts = 8;

      const session = await getSession();
      if (!session) {
        window.location.href = '/pages/auth/login.html';
        return;
      }

      async function checkLevel() {
        const { data: profile } = await sb.from('profiles')
          .select('level')
          .eq('id', session.user.id)
          .single();

        const level = profile?.level || 'socle';

        if ((level === 'pilote' || level === 'radar') || attempts >= maxAttempts) {
          showSuccess(level);
          return;
        }

        attempts++;
        setTimeout(checkLevel, 1000);
      }

      checkLevel();
    });

    function showSuccess(level) {
      const lvlLabels = { pilote:'Pilote', radar:'Radar', socle:'Socle' };
      const lvlIcons  = { pilote:'✈️', radar:'📡', socle:'🛡️' };
      const lvlHrefs  = { pilote:'/pages/pilote/index.html', radar:'/pages/radar/index.html', socle:'/pages/socle/index.html' };
      const lvlBtns   = { pilote:'btn-pilote', radar:'btn-radar', socle:'btn-socle' };

      document.getElementById('success-level').innerHTML =
        `${lvlIcons[level] || '🎉'} Ton accès <strong style="color:var(--${level})">${lvlLabels[level]}</strong> est activé.`;

      const cta = document.getElementById('cta-primary');
      cta.href       = lvlHrefs[level] || '/pages/socle/index.html';
      cta.className  = `btn ${lvlBtns[level] || 'btn-socle'} btn-full`;
      cta.textContent = `Accéder à ${lvlLabels[level]} →`;

      document.getElementById('loading-indicator').style.display = 'none';
      document.getElementById('cta-section').style.display       = 'flex';
    }
  </script>
</body>
</html>
