<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar — WealthWaffle Admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ww-all.css">
</head>
<body class="adm-body">
<div id="adm-toast" class="adm-toast"></div>
<header class="adm-header">
  <div class="adm-header-left">
    <a href="/admin/" class="adm-logo">WealthWaffle 🧇</a>
    <nav class="adm-nav">
      <a href="/admin/" class="adm-nav-link">Dashboard</a>
      <a href="/admin/users.html" class="adm-nav-link">Utilisateurs</a>
      <a href="/admin/radar.html" class="adm-nav-link active">Radar</a>
      <a href="/admin/erreurs.html" class="adm-nav-link">Erreurs</a>
      <a href="/admin/leads.html" class="adm-nav-link">Leads</a>
      <a href="/admin/analytics.html" class="adm-nav-link">Analytics</a>
    </nav>
  </div>
  <button class="adm-logout" id="adm-logout-btn">Déconnexion</button>
</header>
<main class="adm-main">
<h1 class="adm-page-title">📡 Radar — Projets</h1>
<p class="adm-page-sub">Analyser, valider et publier les projets equity</p>

<div class="adm-kpi-grid">
  <div class="adm-kpi"><span class="adm-kpi-label">Total projets</span><div class="adm-kpi-value adm-kpi-cyan" id="k-total">—</div></div>
  <div class="adm-kpi"><span class="adm-kpi-label">En attente</span><div class="adm-kpi-value adm-kpi-gold" id="k-pending">—</div></div>
  <div class="adm-kpi"><span class="adm-kpi-label">Publiés</span><div class="adm-kpi-value adm-kpi-green" id="k-published">—</div></div>
  <div class="adm-kpi"><span class="adm-kpi-label">Refusés</span><div class="adm-kpi-value adm-kpi-rose" id="k-rejected">—</div></div>
</div>
<div class="adm-toolbar">
  <input type="text" class="adm-search" id="search" placeholder="Rechercher un projet…">
  <button class="adm-filter-btn active" data-status="all">Tous</button>
  <button class="adm-filter-btn" data-status="pending">⏳ En attente</button>
  <button class="adm-filter-btn" data-status="published">✅ Publiés</button>
  <button class="adm-filter-btn" data-status="rejected">❌ Refusés</button>
</div>
<div class="adm-section">
  <div class="adm-table-wrap">
    <table class="adm-table">
      <thead><tr><th>Nom</th><th>Plateforme</th><th>Type</th><th>Statut</th><th>Soumis le</th><th>Actions</th></tr></thead>
      <tbody id="radar-tbody"><tr><td colspan="6" class="adm-loading">Chargement…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Modal analyse -->
<div class="adm-modal-overlay" id="analyse-modal">
  <div class="adm-modal">
    <p class="adm-modal-title">✏️ Analyse du projet</p>
    <input class="adm-modal-input" id="modal-name" placeholder="Nom du projet" >
    <input class="adm-modal-input" id="modal-platform" placeholder="Plateforme (Spreds, Bolero…)">
    <div class="adm-2col-tight">
      <input class="adm-modal-input" id="modal-rate" placeholder="Taux (%)">
      <input class="adm-modal-input" id="modal-min" placeholder="Min. invest (€)">
    </div>
    <textarea class="adm-textarea" id="modal-summary" placeholder="Résumé (affiché dans le feed)"></textarea>
    <select class="adm-modal-select" id="modal-verdict">
      <option value="interessant">✅ Intéressant</option>
      <option value="surveiller">👀 À surveiller</option>
      <option value="insuffisant">Insuffisant</option>
      <option value="trop_risque">⚠️ Trop risqué</option>
    </select>
    <select class="adm-modal-select" id="modal-status">
      <option value="pending">⏳ En attente</option>
      <option value="published">✅ Publier</option>
      <option value="rejected">❌ Refuser</option>
    </select>
    <div class="adm-modal-actions">
      <button class="adm-btn adm-btn-ghost" id="modal-cancel">Annuler</button>
      <button class="adm-btn adm-btn-cyan" id="modal-ai">🤖 Analyse IA</button>
      <button class="adm-btn adm-btn-green" id="modal-save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
let allProjects = [], currentFilter = 'all', editingId = null;

const STATUS_BADGE = { pending:'adm-badge-gold', published:'adm-badge-green', rejected:'adm-badge-rose' };

function renderProjects(list) {
  const tbody = document.getElementById('radar-tbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="6" class="adm-empty">Aucun projet</td></tr>'; return; }
  tbody.innerHTML = list.map(p => `<tr>
    <td style="font-weight:600;font-size:0.82rem;">${p.name||'—'}</td>
    <td style="font-size:0.72rem;color:#888;">${p.platform||'—'}</td>
    <td style="font-size:0.72rem;color:#888;">${p.type||'—'}</td>
    <td><span class="adm-badge ${STATUS_BADGE[p.status]||'adm-badge-muted'}">${p.status||'pending'}</span></td>
    <td style="font-size:0.72rem;color:#888;">${fmtDate(p.created_at)}</td>
    <td><button class="adm-btn adm-btn-cyan" style="font-size:0.68rem;padding:4px 8px;" onclick="openAnalyse('${p.id}')">Éditer</button></td>
  </tr>`).join('');
}

function filterAndRender() {
  const q = document.getElementById('search').value.toLowerCase();
  let f = allProjects;
  if (currentFilter !== 'all') f = f.filter(p => p.status === currentFilter);
  if (q) f = f.filter(p => p.name?.toLowerCase().includes(q) || p.platform?.toLowerCase().includes(q));
  renderProjects(f);
}

function openAnalyse(id) {
  const p = allProjects.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modal-name').value = p.name || '';
  document.getElementById('modal-platform').value = p.platform || '';
  document.getElementById('modal-rate').value = p.rate || '';
  document.getElementById('modal-min').value = p.min_invest || '';
  document.getElementById('modal-summary').value = p.summary || '';
  document.getElementById('modal-verdict').value = p.verdict || 'surveiller';
  document.getElementById('modal-status').value = p.status || 'pending';
  document.getElementById('analyse-modal').classList.add('open');
}

document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('analyse-modal').classList.remove('open'));

document.getElementById('modal-save').addEventListener('click', async () => {
  const update = {
    name: document.getElementById('modal-name').value,
    platform: document.getElementById('modal-platform').value,
    rate: parseFloat(document.getElementById('modal-rate').value) || null,
    min_invest: parseInt(document.getElementById('modal-min').value) || null,
    summary: document.getElementById('modal-summary').value,
    verdict: document.getElementById('modal-verdict').value,
    status: document.getElementById('modal-status').value,
    updated_at: new Date().toISOString(),
  };
  const { error } = await sb.from('projects').update(update).eq('id', editingId);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast('Projet mis à jour ✅');
  document.getElementById('analyse-modal').classList.remove('open');
  const idx = allProjects.findIndex(x => x.id === editingId);
  if (idx >= 0) { allProjects[idx] = { ...allProjects[idx], ...update }; filterAndRender(); }
});

document.getElementById('modal-ai').addEventListener('click', () => {
  toast('Analyse IA — Edge Function analyze-project à connecter (voir ROADMAP EF4)', true);
});

document.querySelectorAll('.adm-filter-btn[data-status]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.adm-filter-btn[data-status]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    filterAndRender();
  });
});
document.getElementById('search').addEventListener('input', filterAndRender);
window.openAnalyse = openAnalyse;

window.addEventListener('load', async () => {
  const s = await requireAdmin(); if (!s) return;
  const { data: projects } = await sb.from('projects').select('*').order('created_at',{ascending:false});
  allProjects = projects || [];
  document.getElementById('k-total').textContent = allProjects.length;
  document.getElementById('k-pending').textContent = allProjects.filter(p=>p.status==='pending').length;
  document.getElementById('k-published').textContent = allProjects.filter(p=>p.status==='published').length;
  document.getElementById('k-rejected').textContent = allProjects.filter(p=>p.status==='rejected').length;
  renderProjects(allProjects);
});
</script>
</main>
<script src="/assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const sb = createClient(
  window.__CF_SUPABASE_URL__ || 'https://klhhztxvgudefxmciwfz.supabase.co',
  window.__CF_SUPABASE_ANON_KEY__ || ''
);
async function requireAdmin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/compte/connexion.html?next=' + encodeURIComponent(location.pathname); return null; }
  const { data: p } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
  if (!p?.is_admin) { window.location.href = '/'; return null; }
  return session;
}
function toast(msg, isErr) {
  const t = document.getElementById('adm-toast');
  t.textContent = msg;
  t.className = 'adm-toast show' + (isErr ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-BE', { day:'2-digit', month:'short', year:'numeric' });
}
document.getElementById('adm-logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut(); localStorage.clear(); window.location.href = '/';
});
window.sb = sb; window.toast = toast; window.fmtDate = fmtDate;
</body></html>
